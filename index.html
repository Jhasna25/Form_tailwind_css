<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-green-200 flex justify-evenly max-[52.5rem]:flex-col">
    <!-- ---------------- SIGN UP -------------------------------------------------------- -->
    <div class="bg-green-50 max-w-[400px] m-auto mb-8 mt-[30px] p-6 rounded-lg shadow-xl max-sm:w-[300px] ">
        <h1 class="text-center text-[1.8rem] font-bold text-green-950 mb-2 max-sm:text-[1.2rem]">Sign Up</h1>
        <p class="text-center text-gray-600 text-[0.7rem] mb-2 max-sm:text-[0.6rem]">Let's get started with your 30 days free trial</p>


        <!-- ------------ input section ---------------------- -->
        <div class="mb-3">
            <!-- ------- name ------------- -->
            <div class="mb-2">
                <label 
                    class="text-[0.9rem] max-sm:text-[0.7rem]"
                    for="Name">
                    Name
                </label>
                <input 
                    class="border-[1px] border-gray-400 rounded-sm px-2 block w-full h-8 max-sm:h-7 max-sm:text-[0.8rem] "
                    type="text"
                    id="name"
                    placeholder="Username"
                    required               
                />
            </div>

            <!-- --------Email---------------- -->
            <div class="mb-2">
                <label 
                    class="text-[0.9rem] max-sm:text-[0.7rem]"
                    for="email">
                    Email
                </label>
                <input 
                    class="border-[1px] border-gray-400 rounded-sm px-2 block w-full h-8 max-sm:h-7 max-sm:text-[0.8rem]"
                    type="email"
                    id="email"
                    placeholder="Email"
                    required               
                />
            </div>

            <!-- ------------- password ------------ -->
            <div class="mb-2">
                <label 
                    class="text-[0.9rem] max-sm:text-[0.7rem]"
                    for="password">
                    Password
                </label>
                <div class="relative">
                    <input 
                    class="border-[1px] border-gray-400 rounded-sm px-2 block w-full pe-9 h-8 max-sm:h-7 max-sm:text-[0.8rem]"
                    type="password"
                    id="password"
                    placeholder="Password"
                    required               
                />
                    <i class="absolute right-[10px] bottom-[50%] translate-y-2 max-sm:text-[0.8rem] text-green-900 fa-regular fa-eye"></i>
                </div>
                
            </div>

            <div class="mb-2">
                <label 
                    class="text-[0.9rem] max-sm:text-[0.7rem]"
                    for="age">
                    Age
                </label>
                <input 
                    class="border-[1px] border-gray-400 rounded-sm px-2 block w-full h-8 max-sm:h-7 max-sm:text-[0.8rem]"
                    type="text"
                    id="number"
                    placeholder=""
                    required               
                />
            </div>

            <div class="mb-2">
                <label 
                    class="text-[0.9rem] max-sm:text-[0.7rem]"
                    for="phone">
                    Phone No.
                </label>
                <input 
                    class="border-[1px] border-gray-400 rounded-sm px-2 block w-full h-8 max-sm:h-7 max-sm:text-[0.8rem]"
                    type="text"
                    id="number"
                    placeholder="Phone Number"
                    required               
                />
            </div>

            <div class="mb-2">
                <label 
                    class="text-[0.9rem] max-sm:text-[0.7rem]"
                    for="gender">
                    Gender
                </label>
                <select 
                    class="border-[1px] border-gray-400 rounded-sm px-2 block w-full h-8 text-gray-500 max-sm:h-7 max-sm:text-[0.8rem]"
                    name="gender" 
                    id="gender">
                    <option value="" disabled selected>Select</option>
                    <option value="male">Male</option>
                    <option value="female">female</option>
                    <option value="other">Other</option>
                    <option value="notSay">Prefer Not to say</option>
                </select>
            </div>
        </div>


        <!-- ----------- Button ---------------- -->
         <div class="mb-4">
            <button class="bg-green-700 hover:bg-green-600 cursor-pointer px-5 h-9 rounded-sm w-full text-gray-50 font-[600] mb-2 max-sm:h-7 max-sm:text-[0.8rem]">Sign Up</button>
            <p class="text-center text-gray-600 text-[0.7rem] mb-2 max-sm:text-[0.6rem]">
                Already have an acount? 
                <a class="text-blue-800 font-bold hover:underline" href="#">Log In</a>
            </p>
         </div>

        <!-- ---OR--- -->
            <p class="border-t-2 border-gray-400 relative mb-4">
                <span class="bg-green-50 px-2 absolute top-[-13px] left-[50%] -translate-x-2 max-sm:text-[0.8rem]">or</span>
            </p>


        <!-- ---- SIgn up with google --------- -->
         <div>
            <button class="bg-green-50 hover:bg-green-100 cursor-pointer px-5 pt-1 h-9 rounded-sm w-full text-green-950 font-[600] border-gray-400 border-[1px] mb-2 relative flex justify-center max-sm:h-7 max-sm:text-[0.7rem]">
                <img
                    class="absolute left-[22%] top-2 h-4 max-sm:left-[55px] max-sm:top-[6px] max-sm:h-3" 
                    src="https://cdn-icons-png.flaticon.com/128/281/281764.png" alt=""
                />
                Sign up with Google
            </button>
            <p class="text-center text-gray-600 text-[0.7rem] mb-2 max-sm:text-[0.6rem]">
                By signing up to create an account I accept company's 
                <a class="text-blue-800 font-bold hover:underline" href="#">Terms of use and Privacy Policy</a>
            </p>
         </div>
    </div>
    
</body>
</html>
